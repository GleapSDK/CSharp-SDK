name: Release (publish NuGet + tag Unity)

# Publishing is driven by a version tag, e.g.:
#   git tag v0.1.0-beta.1 && git push origin v0.1.0-beta.1
# The tag also serves as the Unity UPM install ref:
#   https://github.com/GleapSDK/CSharp-SDK.git?path=/unity/com.gleap.sdk#v0.1.0-beta.1
#
# Auth: NuGet Trusted Publishing (OIDC) — no long-lived API key. Configure a policy at
# nuget.org > Trusted Publishing (Repository Owner: GleapSDK, Repository: CSharp-SDK,
# Workflow File: release.yml, Environment: empty). The only secret needed is NUGET_USER
# = your nuget.org profile name (NOT your email).
#
# The package version comes from <Version> in Directory.Build.props — keep the tag in step
# with it (this workflow does not rewrite the version).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  # Gleap.Core + Gleap.Extensions.Logging are netstandard2.0 — build anywhere.
  nuget-core:
    name: Pack & push Core + Extensions.Logging (Linux)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for NuGet trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Pack
        run: |
          dotnet pack src/Gleap.Core/Gleap.Core.csproj -c Release -o artifacts
          dotnet pack src/Gleap.Extensions.Logging/Gleap.Extensions.Logging.csproj -c Release -o artifacts
      - name: NuGet login (OIDC -> short-lived key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

  # Gleap.WebView2 targets net8.0-windows (WPF + WebView2) — needs a Windows runner.
  nuget-windows:
    name: Pack & push Gleap.WebView2 (Windows)
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Pack
        run: dotnet pack src/Gleap.WebView2/Gleap.WebView2.csproj -c Release -o artifacts
      - name: NuGet login (OIDC -> short-lived key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

  # Gleap.Maui targets android/ios/maccatalyst (+ windows only when built on Windows).
  # iOS/MacCatalyst require Xcode, so this runs on macOS and ships those three TFMs.
  # NOTE: the net*-windows MAUI TFM is intentionally not built here (a Windows-only TFM cannot
  # build on macOS). MAUI-on-Windows apps can use Gleap.WebView2 directly; revisit if a combined
  # multi-RID package is needed for stable.
  nuget-maui:
    name: Pack & push Gleap.Maui (macOS)
    runs-on: macos-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          # MAUI targets net10.0-*; if 10.0 is still preview at release time, add
          # `dotnet-quality: preview`.
          dotnet-version: 10.0.x
      - name: Install MAUI workload
        run: dotnet workload install maui
      - name: Pack
        run: dotnet pack maui/Gleap.Maui/Gleap.Maui.csproj -c Release -o artifacts
      - name: NuGet login (OIDC -> short-lived key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

  # Unity ships via UPM Git URL (the tag above is the install ref). No registry push needed.
  # This job only sanity-checks that the bundled Gleap.Core.dll matches the tagged source.
  unity-check:
    name: Verify bundled Unity Gleap.Core.dll is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Rebuild Gleap.Core and diff against the bundled DLL
        run: |
          dotnet build src/Gleap.Core/Gleap.Core.csproj -c Release -o /tmp/core
          if ! cmp -s /tmp/core/Gleap.Core.dll unity/com.gleap.sdk/Runtime/Plugins/Gleap.Core.dll; then
            echo "::warning::Bundled Unity Gleap.Core.dll differs from a fresh Release build — rebuild & commit it before tagging."
          fi
